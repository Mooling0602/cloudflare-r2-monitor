name: release

# 只在推 tag 时触发。tag 形如 0.1.0（不带 v），与 Cargo.toml 的 version、CHANGELOG 的 H2 标题
# 三者必须完全一致 —— release-note.sh 就是靠这个标题找发布说明的，对不上会直接失败。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 0.1.0），必须是已存在的 tag'
        required: true
        type: string

permissions:
  # 创建 Release 与上传资产需要写权限。除此之外不申请任何多余权限。
  contents: write

env:
  # 与 ci.yml 保持一致。发布时 Linux 产物由 nix 构建，顺便推进这个缓存。
  CACHIX_CACHE_NAME: mooling

jobs:
  # 先做一次完整校验：版本号三处一致、CHANGELOG 有对应小节、测试通过。
  # 校验失败就不该产出任何资产 —— 一个 tag 指向坏代码比没有 Release 更糟。
  verify:
    name: verify
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -eu
          # 触发方式决定版本来源：tag 推送取 tag 名，手动触发取输入。
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${ref}"

      - name: Version must match Cargo.toml
        run: |
          set -eu
          want="${{ steps.version.outputs.version }}"
          got="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$got" ]; then
            echo "::error::tag 是 ${want}，而 Cargo.toml 里是 ${got}；两者必须一致。"
            exit 1
          fi

      - name: CHANGELOG must describe this version
        run: |
          set -eu
          want="${{ steps.version.outputs.version }}"
          if ! grep -qxF "## ${want}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 '## ${want}' 小节，发布说明无从生成。"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

  # 这个 job 只负责把产物推进 Cachix，不发 Release 资产。
  # nix 构建出来的二进制，ELF interpreter 与 RUNPATH 都指向 /nix/store 里的 glibc，
  # 在没有对应 store 路径的机器上根本起不来（实测报 cannot execute: required file not found）。
  # NixOS 用户本来就走 flake 装，不需要这个文件。
  cache-linux:
    name: cache (x86_64-linux)
    needs: verify
    runs-on: ubuntu-22.04
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Set up Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix build
        run: nix build .#default --print-build-logs

      - name: Resolve store path
        id: out
        run: echo "path=$(nix build .#default --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"

      - name: Push to Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: cachix push "$CACHIX_CACHE_NAME" "${{ steps.out.outputs.path }}"

  # 唯一对外发布的二进制。用 cargo 直接编，解释器是 /lib64/ld-linux-x86-64.so.2，
  # 依赖只有 glibc 自带的那几个，任何 glibc 系发行版都能跑。
  # 用 ubuntu-22.04（glibc 2.35）而不是 latest，是为了让产物能在更老的发行版上跑：
  # 二进制在旧系统上编、在新系统上跑没问题，反过来不行。
  binary-cargo:
    name: binary (x86_64-linux)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Collect binary
        run: |
          set -eu
          # 名字不带版本号，README 里才能用 latest/download/ 这种永久链接。
          name="cf-r2-monitor-x86_64-linux"
          mkdir -p dist
          cp target/release/cf-r2-monitor "dist/${name}"
          chmod +x "dist/${name}"
          # 解释器必须是 /lib64 下的那个；指向 /nix/store 的话这个文件在别的机器上起不来。
          echo "--- ELF interpreter ---"
          readelf -l "dist/${name}" | grep -i interpreter || true
          echo "--- 依赖库（只应出现 glibc 自带的几个）---"
          ldd "dist/${name}" || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-linux
          path: dist/*
          if-no-files-found: error

  # 最后一步：把产物和 CHANGELOG 生成的说明发成一个 Release。
  # 这里不发 cargo（crates.io），用户明确要求只预构建二进制。
  # cache-linux 不在 needs 里：它只负责推二进制缓存，失败了也不该挡住发布。
  publish:
    name: publish
    needs: [verify, binary-cargo]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 compare 链接需要完整历史与 tag，浅克隆拿不到。
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 首发（没有任何更早的 tag）时 previous-tag 传 -，脚本会退化成 compare/<version>。
      - name: Render release notes
        id: notes
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          previous="$(git tag --sort=-v:refname | grep -vx "${version}" | head -1 || true)"
          [ -n "$previous" ] || previous="-"
          echo "上一个 tag：${previous}"
          .github/scripts/release-note.sh \
            "${version}" CHANGELOG.md "${{ github.repository }}" "${previous}" > notes.md
          echo "--- 生成结果 ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          ls -l dist
          # 重跑时 Release 可能已经存在（比如上次上传资产时 GitHub 抽风）。
          # 这种情况下只补没传上去的资产，不要撞车失败。
          if gh release view "${version}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${version} 已存在，改为补传资产。"
            gh release upload "${version}" dist/* \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${version}" \
              --repo "${{ github.repository }}" \
              --title "v${version}" \
              --notes-file notes.md \
              dist/*
          fi
