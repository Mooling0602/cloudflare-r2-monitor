name: release

# 只在推 tag 时触发。tag 形如 0.1.0（不带 v），与 Cargo.toml 的 version、CHANGELOG 的 H2 标题
# 三者必须完全一致 —— release-note.sh 就是靠这个标题找发布说明的，对不上会直接失败。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 0.1.0），必须是已存在的 tag'
        required: true
        type: string

permissions:
  # 创建 Release 与上传资产需要写权限。除此之外不申请任何多余权限。
  contents: write

env:
  # 与 ci.yml 保持一致。
  CACHIX_CACHE_NAME: mooling

jobs:
  # 先做一次完整校验：版本号三处一致、CHANGELOG 有对应小节、测试通过。
  # 校验失败就不该产出任何资产 —— 一个 tag 指向坏代码比没有 Release 更糟。
  verify:
    name: verify
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -eu
          # 触发方式决定版本来源：tag 推送取 tag 名，手动触发取输入。
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "version=${ref}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${ref}"

      - name: Version must match Cargo.toml
        run: |
          set -eu
          want="${{ steps.version.outputs.version }}"
          got="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$got" ]; then
            echo "::error::tag 是 ${want}，而 Cargo.toml 里是 ${got}；两者必须一致。"
            exit 1
          fi

      - name: CHANGELOG must describe this version
        run: |
          set -eu
          want="${{ steps.version.outputs.version }}"
          if ! grep -qxF "## ${want}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 '## ${want}' 小节，发布说明无从生成。"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-targets

  # 这个 job 只负责把产物推进 Cachix，不发 Release 资产。
  # nix 构建出来的二进制，ELF interpreter 与 RUNPATH 都指向 /nix/store 里的 glibc，
  # 在没有对应 store 路径的机器上根本起不来（实测报 cannot execute: required file not found）。
  # NixOS 用户本来就走 flake 装，不需要这个文件。
  cache-linux:
    name: cache (x86_64-linux)
    needs: verify
    runs-on: ubuntu-22.04
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Set up Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix build
        run: nix build .#default --print-build-logs

      - name: Resolve store path
        id: out
        run: echo "path=$(nix build .#default --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"

      - name: Push to Cachix
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        run: cachix push "$CACHIX_CACHE_NAME" "${{ steps.out.outputs.path }}"

  # 对外发布的裸二进制，每个平台一份，不打包成压缩包。
  # 全部走原生 runner 编（Windows 没有免费的原生 ARM/x86 组合时用 cargo-xwin 交叉编），
  # 这样不需要维护交叉链接器，产物也和实际运行环境一致。
  binary:
    name: binary (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要连带取消其它平台，这样一次运行就能看到所有平台的错误。
      # 但 publish 仍然等齐全部平台 —— 发一个缺胳膊少腿的 Release 比不发更糟。
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 用 22.04（glibc 2.35）而不是 latest：
          # 二进制在旧系统上编、在新系统上跑没问题，反过来不行。
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: x86_64-linux
            xwin: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: aarch64-linux
            xwin: false
          # macos-15-intel 是最后一代 x86_64 macOS runner；macos-15 是 arm64。
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: x86_64-darwin
            xwin: false
          - target: aarch64-apple-darwin
            os: macos-15
            name: aarch64-darwin
            xwin: false
          # Windows msvc 在 Linux 上交叉编译，用 cargo-xwin 从微软服务器拉 CRT 与 SDK。
          - target: x86_64-pc-windows-msvc
            os: ubuntu-22.04
            name: x86_64-windows
            xwin: true
            xwin_compiler: clang-cl
          # Windows arm64 必须用 clang 驱动而不是 clang-cl：ring 的 build.rs 对
          # aarch64-windows 会强制把编译器换成 clang，而它传的是 MSVC 风格的
          # /imsvc 参数，纯 clang 不认，报 no such file or directory: '/imsvc'。
          - target: aarch64-pc-windows-msvc
            os: ubuntu-22.04
            name: aarch64-windows
            xwin: true
            xwin_compiler: clang
    steps:
      - uses: actions/checkout@v4

      # targets 让 rustup 装上目标平台的标准库；原生构建时它就是 host，装上也无害。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # ring 需要 clang 做汇编与 C 编译；Windows 交叉还需要 lld-link。
      - name: Install cargo-xwin
        if: ${{ matrix.xwin }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # cargo-xwin 靠 rustc 自带的 llvm-ar 软链出 llvm-lib，再用它打包 ring 的静态库。
      # 但 rustup 默认不装 llvm-tools，llvm-ar 不存在，那条软链被静默跳过，
      # 接着 cc-rs 报 error occurred in cc-rs: failed to find tool "llvm-lib"。
      # 装上组件并在同目录补出 llvm-lib / llvm-dlltool，PATH 里就能直接找到。
      - name: Install LLVM tools
        if: ${{ matrix.xwin }}
        run: |
          set -eu
          rustup component add llvm-tools
          bin="$(dirname "$(rustc --print target-libdir)")/bin"
          test -x "${bin}/llvm-ar" || { echo "::error::llvm-tools 没装上"; exit 1; }
          ln -sf llvm-ar "${bin}/llvm-lib"
          ln -sf llvm-ar "${bin}/llvm-dlltool"
          echo "${bin}" >> "$GITHUB_PATH"
          # 立刻验证，免得错误拖到编译 ring 时才暴露。
          "${bin}/llvm-lib" /? > /dev/null
          echo "llvm-ar: $("${bin}/llvm-ar" --version | head -1)"

      # xwin 会把 CRT 与 Windows SDK 下到缓存目录，几百兆，不缓存每次都要重拉。
      - name: Cache xwin sysroot
        if: ${{ matrix.xwin }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ matrix.target }}-17

      - name: cargo build --release
        run: |
          set -eu
          if [ "${{ matrix.xwin }}" = "true" ]; then
            XWIN_CROSS_COMPILER="${{ matrix.xwin_compiler }}" \
              cargo xwin build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      # 名字不带版本号，README 里才能用 latest/download/ 这种永久链接。
      - name: Collect binary
        run: |
          set -eu
          target="${{ matrix.target }}"
          name="cf-r2-monitor-${{ matrix.name }}"
          src="target/${target}/release/cf-r2-monitor"
          case "$target" in
            *windows*) name="${name}.exe"; src="${src}.exe" ;;
          esac
          mkdir -p dist
          cp "$src" "dist/${name}"
          chmod +x "dist/${name}"
          echo "--- 产物信息 ---"
          file "dist/${name}" || true
          # Linux 上额外确认动态链接形态：解释器必须在 /lib 下，
          # 指向 /nix/store 的话这个文件在别的机器上起不来。
          case "$target" in
            *linux*)
              echo "--- ELF interpreter ---"
              readelf -l "dist/${name}" | grep -i interpreter || true
              echo "--- 依赖库（只应出现 glibc 自带的几个）---"
              ldd "dist/${name}" || true
              ;;
            *darwin*)
              echo "--- 动态依赖 ---"
              otool -L "dist/${name}" || true
              ;;
          esac
          ls -l dist
          echo "name=${name}" >> "$GITHUB_ENV"

      # 原生构建出来的东西一定能在本机跑，顺手验一下 --version。
      # Windows 是交叉编译的，本机没有 wine，跳过。
      - name: Smoke test
        if: ${{ !matrix.xwin }}
        run: |
          set -eu
          "./dist/${name}" --version
          "./dist/${name}" --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # 最后一步：把产物和 CHANGELOG 生成的说明发成一个 Release。
  # 这里不发 cargo（crates.io），用户明确要求只预构建二进制。
  # cache-linux 不在 needs 里：它只负责推二进制缓存，失败了也不该挡住发布。
  publish:
    name: publish
    needs: [verify, binary]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 compare 链接需要完整历史与 tag，浅克隆拿不到。
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 首发（没有任何更早的 tag）时 previous-tag 传 -，脚本会退化成 compare/<version>。
      - name: Render release notes
        id: notes
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          previous="$(git tag --sort=-v:refname | grep -vx "${version}" | head -1 || true)"
          [ -n "$previous" ] || previous="-"
          echo "上一个 tag：${previous}"
          .github/scripts/release-note.sh \
            "${version}" CHANGELOG.md "${{ github.repository }}" "${previous}" > notes.md
          echo "--- 生成结果 ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          repo="${{ github.repository }}"
          ls -l dist

          # 重跑时 Release 可能已经存在（比如上次上传资产时 GitHub 抽风）。
          # 这时只补缺的资产，已经传好的绝不去碰 —— 先删后传在接口不稳时很容易两边不讨好。
          if gh release view "${version}" --repo "${repo}" >/dev/null 2>&1; then
            echo "Release ${version} 已存在，检查资产是否齐全。"
            have="$(gh release view "${version}" --repo "${repo}" --json assets --jq '.assets[].name')"
            for f in dist/*; do
              name="$(basename "$f")"
              if printf '%s\n' "$have" | grep -qxF "$name"; then
                echo "已有 ${name}，跳过。"
              else
                echo "补传 ${name}。"
                gh release upload "${version}" "$f" --repo "${repo}"
              fi
            done
          else
            gh release create "${version}" \
              --repo "${repo}" \
              --title "v${version}" \
              --notes-file notes.md \
              dist/*
          fi
